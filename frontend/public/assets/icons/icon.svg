<!-- Dota2 暗铜高光金渐变 (边框内饰) -->
<linearGradient id="dotaAccent" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
    <stop offset="50%" stop-color="#c9974c" />
    <stop offset="100%" stop-color="#4e320f" />
</linearGradient>

        <!-- Dota2 熔岩赤红发光 (标志性 Logo 色) -->
<radialGradient id="dotaRedGlow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#e03b22" stop-opacity="0.8" />
<stop offset="70%" stop-color="#7a140a" stop-opacity="0.2" />
<stop offset="100%" stop-color="#000000" stop-opacity="0" />
</radialGradient>

        <!-- 阴影滤镜 -->
<filter id="dotaShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.9" />
</filter>


        <!-- 英雄头盔/面甲核心图形 (硬派金属锐角造型) -->
        <!-- 头盔额顶冠饰 -->
<path d="M100 48 L114 68 L100 64 L86 68 Z" fill="url(#dotaGold)" />
        <!-- 头盔主轮廓 -->
<path d="M100 58 L142 84 L132 136 L100 156 L68 136 L58 84 Z"
      stroke="url(#dotaGold)" stroke-width="3" stroke-linejoin="bevel" fill="none" />
